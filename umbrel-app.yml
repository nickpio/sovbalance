manifestVersion: 1.1
id: bitbalance
name: bitBalance
tagline: Track your Bitcoin and Monero wallets privately from your own Umbrel
category: bitcoin
version: "1.1.4"
port: 3710
description: >-
  Track your Bitcoin and Monero wallets privately from your own Umbrel.


  Monitor Bitcoin balances using XPUB, YPUB, or ZPUB, and Monero view-only
  wallets using a primary address plus private view key.


  Connects to your local Electrs and Monero Node apps for maximum privacy,
  without relying on third-party balance APIs.


  Stop checking balances on block explorers. Your wallets. Your node. Your privacy.


  Supports multiple wallets, automatic gap limit scanning for Bitcoin, and
  view-only scanning for Monero directly from your Umbrel node.
developer: egzola
website: https://github.com/egzola/bitbalance
repo: https://github.com/egzola/bitbalance
support: https://github.com/egzola/bitbalance/issues
submitter: egzola
submission: https://github.com/getumbrel/umbrel-apps/pull/5082
path: ""
dependencies:
  - electrs
  - monero
