name: Daily release

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create patch release when there are new commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            echo "No version tag found; refusing to guess a starting version."
            exit 1
          fi

          if [[ -z "$(git log -1 --format=%H "$latest_tag"..HEAD)" ]]; then
            echo "No commits since $latest_tag; nothing to release."
            exit 0
          fi

          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest tag is not a semantic version: $latest_tag"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          next_tag="v${major}.${minor}.$((patch + 1))"

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Next version tag already exists: $next_tag"
            exit 1
          fi

          gh release create "$next_tag" \
            --target "$GITHUB_SHA" \
            --title "$next_tag" \
            --generate-notes
