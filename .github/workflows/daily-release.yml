name: Daily release

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next image version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          latest_tag="$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -z "$latest_tag" ]]; then
            echo "No version tag found; refusing to guess a starting version."
            exit 1
          fi

          if [[ -z "$(git log -1 --format=%H "$latest_tag"..HEAD)" ]]; then
            echo "No commits since $latest_tag; nothing to release."
            exit 0
          fi

          if [[ ! "$latest_tag" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "Latest tag is not a semantic version: $latest_tag"
            exit 1
          fi

          major="${BASH_REMATCH[1]}"
          minor="${BASH_REMATCH[2]}"
          patch="${BASH_REMATCH[3]}"
          next_tag="v${major}.${minor}.$((patch + 1))"

          if git rev-parse "$next_tag" >/dev/null 2>&1; then
            echo "Next version tag already exists: $next_tag"
            exit 1
          fi

          echo "tag=$next_tag" >> "$GITHUB_OUTPUT"
          echo "image_version=${next_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Create version tag
        if: steps.version.outputs.tag != ''
        run: git tag "${{ steps.version.outputs.tag }}" "$GITHUB_SHA" && git push origin "${{ steps.version.outputs.tag }}"

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.tag != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3
        if: steps.version.outputs.tag != ''

      - name: Build and publish Docker release
        if: steps.version.outputs.tag != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          provenance: false
          sbom: false
          tags: |
            ghcr.io/nickpio/sovbalance/app:${{ steps.version.outputs.image_version }}
            ghcr.io/nickpio/sovbalance/app:latest
