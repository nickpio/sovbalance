<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Monitor Bitcoin, Monero, and Zcash wallet balances using your own node">
  <meta name="application-name" content="sovBalance">
  <meta name="author" content="nickpio">

  <title>sovBalance 1.4.1</title>

  <link rel="icon" type="image/png" href="/icon.png?v=21">
  <meta name="theme-color" content="#000000">

  <link rel="stylesheet" href="/style.css?v=24">

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script src="/scripts.js?v=24"></script>
</head>

<body>

  <header>
    <div class="logo-title">
      <img src="/logo.png?v=21" alt="sovBalance Logo" class="logo" style="width: 35px; height: 35px;" />
      <h1>sovBalance <span id="app_version"></span></h1>
      
    </div>

    <div class="header-buttons">
      <button class="btn btn-secondary" type="button" onclick="openSettings()">Settings</button>
      <button class="btn btn-primary" type="button" onclick="openWalletModal()">Add Wallet</button>
      <button class="btn btn-primary" type="button" onclick="load(true)">Refresh</button>
    </div>

  </header>

  <div class="container">

    <div class="card total-wrapper">

      <div class="metric main-metric">
        <div class="label">Total Balance</div>
        <div id="totalTop" class="big-value">-</div>
        <div class="coin-totals">
          <div id="totalBTC" class="sub-value"></div>
          <div id="totalXMR" class="sub-value"></div>
          <div id="totalZEC" class="sub-value"></div>
        </div>
      </div>

      <div class="metric side-metric">

        <div class="icon">
          <svg viewBox="0 0 24 24" class="icon-svg">
            <path d="M5 18V6M5 18h14M8 14l3-3 3 2 4-5" fill="none" stroke="currentColor" stroke-width="1.8"
              stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </div>

        <div>
          <div class="label">Prices</div>
          <div id="btcPrice" class="side-value price-line" hidden>
            <img class="price-symbol" src="/symbols/btc.png" alt="BTC">
            <span class="price-fiat"></span>
          </div>
          <div id="xmrPrice" class="side-value price-line" hidden>
            <img class="price-symbol" src="/symbols/xmr.svg" alt="XMR">
            <span class="price-fiat"></span>
          </div>
          <div id="zecPrice" class="side-value price-line" hidden>
            <img class="price-symbol" src="/symbols/zec.png" alt="ZEC">
            <span class="price-fiat"></span>
          </div>
        </div>
      </div>

      <div class="metric side-metric">

        <div class="icon">
          <svg viewBox="0 0 24 24" class="icon-svg">
            <circle cx="12" cy="12" r="7" fill="none" stroke="currentColor" stroke-width="1.9" />
            <path d="M12 8v4l3 2" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"
              stroke-linejoin="round" />
          </svg>
        </div>

        <div>
          <div class="label">Updated</div>
          <div id="lastUpdated" class="side-value"></div>
        </div>
      </div>

    </div>


    <div class="card">

      <table id="t">

        <thead>
          <tr>
            <th>Wallet</th>
            <th class="percentage">%</th>
            <th class="balance">Amount</th>
            <th class="chevron"></th>
          </tr>
        </thead>

        <tbody>
          <tr>
            <td colspan="4" class="loading">
              <div class="scanner">
                <span id="scanText">Scanning wallet...</span>
                <div class="scanbar"></div>
              </div>
            </td>
          </tr>
        </tbody>

      </table>

      <canvas id="chart"></canvas>

    </div>

  </div>

  <footer>
    <span>Fork of 'bitBalance' by egzola, developed by nickpio</span>
    <span class="footer-sep">·</span>
    <button id="donateBtn" class="donate-btn">⚡ Tip with Lightning</button>
  </footer>

</body>

</html>
