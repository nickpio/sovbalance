version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitbalance_app_1
      APP_PORT: 3710

  app:
    image: ghcr.io/nickpio/sovbalance/app:1.2.1@sha256:e0a9704fef0c131ec92e1137bc5316c5c4da979d010904d22c566a5dd0b03479
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - wallet_rpc
    environment:
      PORT: 3710
      ELECTRUM_HOST: $APP_ELECTRS_NODE_IP
      ELECTRUM_PORT: $APP_ELECTRS_NODE_PORT
      WALLET_RPC_HOST: wallet_rpc
      WALLET_RPC_PORT: 18083
    volumes:
      - ${APP_DATA_DIR}/data:/data

  wallet_rpc:
    image: ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.1@sha256:8f3fe0fd8f43b845c434c3936ef3808f411d4f0826c0536a68a2d9bf0866c557
    restart: on-failure
    stop_grace_period: 1m
    # Image USER is monero. Umbrel bind-mounts are often root:root 755, so
    # run as root like the app container or generate_from_keys cannot write.
    user: "0:0"
    command:
      - --wallet-dir=/home/monero/wallet
      - --rpc-bind-port=18083
      - --disable-rpc-login
      - --trusted-daemon
      - --daemon-host=${APP_MONERO_NODE_IP}
      - --daemon-port=${APP_MONERO_RPC_PORT}
      - "--daemon-login=${APP_MONERO_RPC_USER}:${APP_MONERO_RPC_PASS}"
    volumes:
      - ${APP_DATA_DIR}/monero-wallets:/home/monero/wallet
