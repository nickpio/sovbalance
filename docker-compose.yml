version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bitbalance_app_1
      APP_PORT: 3710

  app:
    image: ghcr.io/nickpio/sovbalance/app:1.4.2@sha256:d6291cdc6c6dfc2698dc7f61904e464d8356d1af2b582e0aba95580823a1e13b
    restart: on-failure
    stop_grace_period: 1m
    depends_on:
      - wallet_rpc
    environment:
      PORT: 3710
      ELECTRUM_HOST: $APP_ELECTRS_NODE_IP
      ELECTRUM_PORT: $APP_ELECTRS_NODE_PORT
      WALLET_RPC_HOST: wallet_rpc
      WALLET_RPC_PORT: 18083
      ZCASH_LWD_HOST: ${APP_ZCASH_NODE_IP:-}
      ZCASH_LWD_PORT: ${APP_ZCASH_WALLET_PORT:-9067}
    volumes:
      - ${APP_DATA_DIR}/data:/data

  wallet_rpc:
    image: ghcr.io/sethforprivacy/simple-monero-wallet-rpc:v0.18.5.1@sha256:8f3fe0fd8f43b845c434c3936ef3808f411d4f0826c0536a68a2d9bf0866c557
    restart: on-failure
    stop_grace_period: 1m
    # Image USER is monero. Umbrel bind-mounts are often root:root 755, so
    # run as root like the app container or generate_from_keys cannot write.
    user: "0:0"
    command:
      - --wallet-dir=/home/monero/wallet
      - --rpc-bind-port=18083
      - --disable-rpc-login
      - --trusted-daemon
      - --daemon-host=${APP_MONERO_NODE_IP:-10.21.21.179}
      - --daemon-port=${APP_MONERO_RPC_PORT:-18081}
      - "--daemon-login=${APP_MONERO_RPC_USER:-monero}:${APP_MONERO_RPC_PASS:-x}"
    volumes:
      - ${APP_DATA_DIR}/monero-wallets:/home/monero/wallet
