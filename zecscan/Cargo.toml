[package]
name = "zecscan"
version = "0.1.0"
edition = "2021"
description = "View-only Zcash scanner for sovBalance unified viewing keys"

[[bin]]
name = "zec-scan"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
rand = "0.8"
rusqlite = "0.37"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
tonic = { version = "0.14", default-features = false, features = ["transport"] }
zcash_address = "0.13"
zcash_client_backend = { version = "0.24", features = ["lightwalletd-tonic-transport", "sync", "orchard", "transparent-inputs"] }
zcash_client_sqlite = { version = "0.22", features = ["orchard", "transparent-inputs"] }
zcash_keys = { version = "0.16", features = ["orchard", "transparent-inputs"] }
zcash_protocol = "0.10"
